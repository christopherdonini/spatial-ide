[package]
name = "spatial-engine"
version = "0.0.0"
edition = "2021"
publish = false
# ADR-009 item 1: forever-open core. Inherited from `[workspace.package]`.
license.workspace = true
description = "data-engine module (docs/02, docs/05): DuckDB + Arrow, GeoParquet, CRS as a type."

[features]
# Seeded GeoParquet fixture writer. Test support only — gated so it cannot be reached from the
# shipped path by accident (docs/02 does not scope a synthetic generator to this module).
#
# **The feature no longer carries `dep:parquet`** (`engine/LOD-PREREGISTRATION.md` §8 item 2,
# approved by the human's ruling of 2026-09-16 recorded in that file's Amendment 2). The LOD tier
# writer needs the parquet writer on the *shipped* path, so `parquet` is a non-optional dependency
# below; what this feature still gates is the **synthetic generator** (`fixture.rs`, `layout.rs`)
# and nothing else. No new crate enters the tree by this change — only which crates are in the
# conveyed artifact, which is why it reaches ADR-030's notice set.
fixture = []

[dependencies]
arrow = { workspace = true }
# `bundled` builds DuckDB from vendored sources (no cmake on the reference profile); `parquet`
# builds in the parquet reader, without which `read_parquet` does not exist.
#
# `json` statically links the json extension so `json_serialize_sql` — the parser that admits
# caller-authored filter predicates (ADR-021) — is a built-in function. This is a SECURITY
# PROPERTY, not merely a build convenience: admission runs on untrusted, caller-controlled SQL
# text on the control path, and it must acquire its parser at BUILD time, never at runtime. The
# alternative (DuckDB's extension autoload) makes first use of the parser a runtime *fetch* — a
# filesystem write to the extension dir, and, for a non-bundled extension, a network install — an
# unacceptable runtime dependency and reach for a component whose whole job is to bound what
# untrusted input can do (docs/09). Static linking means admission performs no runtime extension
# acquisition of any kind. The CI failure (`Extension Autoloading Error: ... Access is denied` on
# a fresh runner) was the SYMPTOM that surfaced this latent runtime fetch — the reason to fix it is
# the property, not the red build. `json = ["bundled"]`: no new crate in the tree, only more of
# DuckDB's own vendored sources.
duckdb = { version = "1.10505.0", features = ["bundled", "parquet", "json"] }
serde_json = "1"
# Content-addressed identity for derived artifacts (docs/02, docs/05): a spatial index is keyed by
# the content hash of what it was built from, never by a filename.
sha2 = "0.10"
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
# LOD tier construction, route B (`engine/LOD-PREREGISTRATION.md` §2a, §8 item 1). The three
# versions the human's ruling names, resolved and recorded by the dependency gate step in
# `engine/LOD-DEP-RESOLUTION.md` (`Cargo.lock` holds the exact resolution; these requirements are
# written in the same style as every other line here). They are
# engine-local crates, so they are declared here rather than in `[workspace.dependencies]`, which
# carries only what more than one member shares (`arrow`, `bytes`, `tokio`) — the same convention
# `parquet` above already follows.
#
# `geo` supplies `SimplifyVwPreserve` and `Validation`; `wkb` decodes and (new relative to the
# spike) writes WKB; `geo-traits` converts `wkb`'s reader view into `geo_types`. **None of the
# three reaches any Arrow crate** — invalidator I1 (a second Arrow major) does not fire, re-checked
# against this workspace at add time.
geo = "0.33.1"
wkb = "0.9.2"
geo-traits = "0.3.0"

[target.'cfg(windows)'.dependencies]
# The free-disk preflight the human's ruling of 2026-09-16 (question round 6, recorded as
# `engine/LOD-PREREGISTRATION.md` §10 Amendment 6) requires before the first tier is written:
# "the builder requires free space >= the 3.0x bound for that source". `std::fs` has no free-space
# call, so this is `GetDiskFreeSpaceExW` and nothing else.
#
# **No new crate enters the tree.** `windows-sys 0.61.2` is already resolved in both this
# workspace's `Cargo.lock` and `frontends/shell/src-tauri/Cargo.lock` (so it is already in the
# conveyed artifact's notice set), and the one feature named here is a module gate on that crate,
# not another dependency. The in-tree precedent for calling a Win32 API this way is
# `protocol/transport-bakeoff/src/memory.rs:18-40`. Windows-gated, because the call is.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Enables the fixture writer for this crate's own tests without putting it in the shipped surface.
spatial-engine = { path = ".", features = ["fixture"] }
