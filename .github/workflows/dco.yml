name: DCO sign-off

# **Every commit in a pull request carries a `Signed-off-by` trailer**, per ADR-009 item 2 and the
# pre-public checklist's item 2. The Developer Certificate of Origin 1.1 text is in `/DCO`;
# `CONTRIBUTING.md` says what signing off means and how to fix a commit that is missing it.
#
# ## What this checks, stated narrowly
#
# That a `Signed-off-by:` trailer is **present** on each non-merge commit in the pull request, and
# that its `Name <email>` matches the commit's own author or committer identity — or, failing
# that, that a remediation commit for it exists in the same range (see the remediation section
# below, added 2026-09-06).
#
# It does **not** establish that the signer had the right to submit the code — nothing mechanical
# can. The DCO is an affirmation by a person; this workflow checks that the affirmation was made,
# which is the only part a CI job is capable of.
#
# ## "External commits", and why the trigger is `pull_request` only
#
# ADR-009 item 2 says the check runs on "every external commit". Pull requests are the path an
# external contribution takes, so that is the trigger, and **every** commit in the PR is checked
# rather than only those from non-maintainers.
#
# The alternative — an allowlist of maintainer emails that skips their commits — is deliberately not
# implemented. It would be a list to maintain, a hole to widen, and it would exempt exactly the
# commits nobody else reviews. A maintainer typing `git commit -s` costs nothing.
#
# Pushes directly to a branch are not checked, because there is no base to diff against that means
# anything, and because a repository with branch protection routes contributions through pull
# requests anyway.
#
# ## Merge commits are skipped, and that is not a hole
#
# GitHub generates merge commits with no trailer and no author who could have signed one. Skipping
# them is what every DCO implementation does; the commits that carry contributed code are the
# non-merge ones, and those are all checked.
#
# ## Remediation commits (added 2026-09-06 — DECISIONS-PENDING entry 39, the human's ruling)
#
# A commit that cannot be rewritten (already pushed, its hash load-bearing as provenance) may be
# remediated in-history instead of rebased. A failing commit counts as remediated iff a LATER
# commit — a descendant of the failing one, in the same PR range — meets all three of:
#
#   (i)   itself passes the ordinary check above (signed, identity-matching) — an unsigned
#         remediation remediates nothing;
#   (ii)  matches the standard remediation format, naming the failing commit's FULL sha:
#         subject `DCO Remediation Commit for <author>`, body line
#         `I, <author>, hereby add my Signed-off-by to commit: <full sha>` — or the
#         dcoapp-standard wording `... to this commit: <full sha>`, accepted equally (ruled
#         2026-09-06: external contributors will follow the published convention verbatim,
#         and rejecting it over a missing "this" would be pedantry, not protection);
#   (iii) carries the SAME author identity (`Name <email>`) as the commit it remediates, AND its
#         own `Signed-off-by` trailer names that identity — the affirmation itself, not merely
#         the self-asserted author field, must stand in the remediated author's name. Individual
#         remediation only: a remediation whose only affirmation is somebody else's is refused
#         (an author field alone proves nothing — `--author` is a flag anyone can pass). What
#         none of this can do is authenticate: author field and trailer are both strings anybody
#         can type, the same boundary the "stated narrowly" section above draws for the ordinary
#         check; string equality is all a CI job can compare.
#
# A remediated commit is reported as a `::notice::`, never silently passed, and the summary
# line counts remediations separately, so a green run says what it accepted and why.
#
# ## Green as of 2026-08-07 — the not-a-gate caveat is lifted, its history kept
#
# **First run, and first green run: `31199038936`** — `pull_request` on PR #3 (`cut/scale-pass`),
# head `24c48fda`, 2026-08-07T16:44:45Z, complete in 10 s. It reported
# `Checked 11 non-merge commit(s); 0 failed.` and `git rev-list --no-merges main..cut/scale-pass`
# counts 11, so **the check read a real commit range** rather than passing on an empty one — which
# matters more here than a green tick, because a check that passes having examined nothing is the
# failure mode this file warns about twice. **This workflow may now be cited as a gate.**
#
# The history is retained rather than deleted, so a recurrence can be compared against it. Until that
# morning no run of any workflow in this repository had been assigned a GitHub-hosted runner: three
# runs on 2026-08-06, across both `windows-latest` and `ubuntu-latest`, were each cancelled at
# exactly 15 minutes queued having executed no step (evidence table in `product-ci-rust.yml`). Both
# product CI workflows went green on `de6ad08` that morning — `31156155408` rust, `31156155406`
# viewer — which lifted their caveats but not this one, because **this file's gap was never runner
# supply**: it fires on `pull_request`, and the repository's first two pull requests (#1, #2) both
# merged *before* this file was committed (`0487a4e`, 2026-08-07T08:19:50Z). The remedy recorded at
# the time was "one pull request", and one pull request is what closed it.
#
# What a green run here does **not** establish is unchanged and still bounds it: that a trailer is
# present and matches an identity, and nothing about whether the signer had the right to submit.

on:
  pull_request:
    # `synchronize` matters: a contributor who force-pushes a fix must be re-checked, and the
    # default event set does not include it.
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  signed-off-by:
    name: every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0` because the check reads a commit *range*. A shallow clone has no base
      # commit to diff against, and the range would silently be empty — a check that passes because
      # it examined nothing is worse than no check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The script below is a YAML block scalar, so its indentation is stripped by 10 columns before
      # bash sees it. **The `MSG` heredoc terminator sits at column 10 for exactly that reason** —
      # it must land at column 0 in the stripped text, and `<<'MSG'` (not `<<-`) accepts no leading
      # whitespace. Reindenting this block by any amount breaks it silently.
      - name: Check Signed-off-by on every non-merge commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # **Not an error.** `workflow_dispatch` has no pull request and therefore no commit range,
          # and failing here would make the one manual way to get a green run guaranteed red. That
          # escape hatch was added when no run of any workflow here had ever started; it was never
          # needed in the end — the first green run was a real `pull_request` over 11 commits (see
          # the header) — and it stays because a dispatch is still how somebody checks that this file
          # *runs at all*. So it succeeds and says what it did not do.
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "No pull-request commit range: this run has no commits to check."
            echo "The sign-off check runs on pull_request events. A manual dispatch exercises the"
            echo "workflow's setup — checkout, shell, git availability — and nothing more."
            exit 0
          fi

          # `--no-merges`: see the header. `%H` alone, so the loop body controls the formatting.
          commits=$(git rev-list --no-merges "$BASE..$HEAD")

          if [ -z "$commits" ]; then
            echo "No non-merge commits in $BASE..$HEAD — nothing to check."
            exit 0
          fi

          # The ordinary per-commit check, as a function, so pass 1 and the remediation rule's
          # condition (i) share one definition rather than two copies that drift. Returns 1 when
          # no trailer is present, 2 when a trailer is present but matches nobody who wrote or
          # committed the commit. `local` throughout — the caller's loop variables stay its own.
          ordinary_check() {
            local sha author committer trailers
            sha="$1"
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            committer="$(git log -1 --format='%cn <%ce>' "$sha")"

            # `%(trailers:key=Signed-off-by,valueonly)` uses git's own trailer parser rather than a
            # grep over the message body. A grep would match the string anywhere — including inside
            # a quoted diff or a code block in the commit body — and would miss the folded
            # continuation lines the trailer syntax allows.
            trailers=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "$sha")

            if [ -z "$(printf '%s' "$trailers" | tr -d '[:space:]')" ]; then
              return 1
            fi

            # The trailer must match the author or the committer. Requiring a match is what stops a
            # sign-off standing in somebody else's name; accepting *either* is what lets a
            # maintainer rebase or cherry-pick a contributor's signed commit without invalidating
            # the contributor's own affirmation.
            # `--` so an identity beginning with `-` is a pattern, not a grep option; a
            # here-string rather than a pipe so `grep -q`'s early exit cannot SIGPIPE the
            # producer under `pipefail` (rc 141 would read as "no match" — fail-closed but
            # wrong, and dependent on message size).
            if grep -qxF -- "$author" <<< "$trailers"; then
              return 0
            elif grep -qxF -- "$committer" <<< "$trailers"; then
              return 0
            fi
            return 2
          }

          # Pass 1: the ordinary check on every commit. A failing commit is HELD (with its
          # failure code, so pass 2 diagnoses without re-running the check) rather than failed —
          # pass 2 looks for its remediation. Passing commits are recorded too, because only an
          # ordinarily-passing commit may remediate (condition i of the header).
          ordinary_pass=""
          held=""
          checked=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            checked=$((checked + 1))
            rc=0
            ordinary_check "$sha" || rc=$?
            if [ "$rc" -eq 0 ]; then
              ordinary_pass="${ordinary_pass}${sha}"$'\n'
            else
              held="${held}${sha} ${rc}"$'\n'
            fi
          done <<< "$commits"

          # Pass 2: each held commit either has a remediation commit — conditions (i)-(iii) of the
          # header — or fails with the same diagnostics the single-pass version printed.
          failed=0
          remediated=0
          while read -r sha rc; do
            [ -n "$sha" ] || continue
            subject=$(git log -1 --format='%s' "$sha")
            # GitHub decodes %-escapes inside annotation payloads, so a crafted subject could
            # render fake result lines inside the annotation. Neutralize `%`; the plain log
            # below the annotations is unaffected either way.
            subject="${subject//%/%25}"
            author="$(git log -1 --format='%an <%ae>' "$sha")"

            remedy=""
            near_miss=""
            while read -r r; do
              [ -n "$r" ] || continue
              # (i) is by construction: $r comes from ordinary_pass. LATER means ancestry, not
              # rev-list position — a linear scan order would misread a branchy range. (A
              # remediation on a sibling branch inside the range is therefore refused:
              # fail-closed, and the descendant reading is the honest meaning of "later".)
              git merge-base --is-ancestor "$sha" "$r" || continue
              # (iii) same author identity — string equality, the only comparison a CI job can
              # make — AND the remediation's own affirmation in that identity's name. Without
              # the second half, `--author` spoofing lets a commit signed only by somebody else
              # remediate: authored-as the victim, affirmed by nobody who is the victim.
              [ "$(git log -1 --format='%an <%ae>' "$r")" = "$author" ] || continue
              grep -qxF -- "$author" <<< "$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "$r")" || continue
              # (ii) the standard format, full sha. Subject and body sentence both, exactly.
              # Here-strings, not pipes: `grep -q` exits at the first match, and under
              # `pipefail` the producer's SIGPIPE (141) would read as "no match" — a valid
              # remediation inside a large-enough message would be silently refused.
              [ "$(git log -1 --format='%s' "$r")" = "DCO Remediation Commit for ${author}" ] || continue
              body="$(git log -1 --format='%B' "$r")"
              if grep -qxF -- "I, ${author}, hereby add my Signed-off-by to commit: ${sha}" <<< "$body" \
                || grep -qxF -- "I, ${author}, hereby add my Signed-off-by to this commit: ${sha}" <<< "$body"; then
                remedy="$r"
                break
              fi
              # Subject matched, body line did not: remember it so the error below can say so —
              # the exact-match rule otherwise leaves a near-miss author debugging blind.
              near_miss="$r"
            done <<< "$ordinary_pass"

            if [ -n "$remedy" ]; then
              remediated=$((remediated + 1))
              if [ "$rc" -eq 1 ]; then
                echo "::notice::${sha} carries no sign-off of its own, but ${remedy} remediates it — ${subject}"
              else
                echo "::notice::${sha} is signed off by nobody who wrote or committed it, but ${remedy} remediates it — ${subject}"
              fi
              continue
            fi

            if [ "$rc" -eq 1 ]; then
              echo "::error::${sha} is not signed off — ${subject}"
            else # rc=2: a trailer is present but matches nobody who wrote or committed it
              committer="$(git log -1 --format='%cn <%ce>' "$sha")"
              trailers=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "$sha")
              echo "::error::${sha} is signed off, but by nobody who wrote or committed it — ${subject}"
              echo "  author:      ${author}"
              echo "  committer:   ${committer}"
              echo "  signed off:  $(printf '%s' "$trailers" | tr '\n' ';')"
            fi
            if [ -n "$near_miss" ]; then
              echo "  note: ${near_miss} carries the remediation subject for this author but its body"
              echo "  line did not match exactly — the sentence must name the FULL sha, wording per"
              echo "  CONTRIBUTING.md's DCO section."
            fi
            failed=$((failed + 1))
          done <<< "$held"

          echo
          echo "Checked ${checked} non-merge commit(s); ${failed} failed."
          if [ "$remediated" -ne 0 ]; then
            echo "Remediated: ${remediated} commit(s), each named in a ::notice:: above — accepted via a same-identity remediation commit, signed in that identity."
          fi
          if [ "$failed" -ne 0 ]; then
            cat <<'MSG'

          Every commit needs a Signed-off-by trailer (see CONTRIBUTING.md and /DCO).

            git commit -s                  # when making a commit
            git commit --amend -s          # fix the most recent one
            git rebase --signoff <base>    # fix every commit since <base>

          A commit that cannot be rewritten (already pushed, its hash load-bearing) can be
          remediated instead: a later commit by the same author, signed by that same author,
          in the standard remediation format — see CONTRIBUTING.md's DCO section for the
          exact wording.

          The DCO is an affirmation that you have the right to submit the contribution.
          It is not a copyright assignment: you keep the copyright in what you write.
          MSG
            exit 1
          fi
