name: Product CI — bundle viewer

# The static bundle viewer's own suite: type-check, build, and `node --test`.
#
# ## Why this is a second workflow rather than a second job
#
# It needs a different path filter from the Rust one. A change under `renderer/bundle-viewer/src/`
# should not spend a vendored DuckDB build, and a change under `engine/` should not spend a Node
# install. GitHub applies `on.push.paths` per workflow, not per job, so two filters means two files.
#
# ## What it watches that is not obvious
#
# `renderer/tests/data/manifest-key-sets.json` is listed below on purpose. It is the **shared**
# key-set artifact, read by this viewer's `scripts/manifest.test.mjs` *and* by
# `kernel/tests/publish.rs`, and generated by neither. Both workflows watch it, because a change to
# it can break either side and the whole reason it exists is that a reader and a writer with
# separate tables can each stay green while disagreeing with each other.
#
# ## What a green run here means
#
# The viewer type-checks, builds, and its 40-plus unit tests pass — including the manifest mutation
# sweep, which walks every object in a complete manifest and asserts that removing any defined field
# or adding an undefined one is refused.
#
# It does **not** cover the headless-browser acceptance run (`scripts/run-acceptance.mjs`). That
# drives a real browser against a served bundle produced by a real publish, so it needs Chrome and a
# built bundle, and it is an operator-run instrument rather than a per-push check. `kernel/RESULTS.md`
# records how to run it and what it established. Nothing here is a rendering, timing or precision
# measurement of any kind.

on:
  push:
    paths:
      - "renderer/bundle-viewer/**"
      - "renderer/tests/data/**"
      - ".github/workflows/product-ci-viewer.yml"
  pull_request:
    paths:
      - "renderer/bundle-viewer/**"
      - "renderer/tests/data/**"
      - ".github/workflows/product-ci-viewer.yml"
  workflow_dispatch:

concurrency:
  group: product-ci-viewer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  viewer:
    name: typecheck · build · test
    # **ubuntu-latest, and the asymmetry with the Rust workflow is deliberate.** This is pure
    # TypeScript with no native surface of its own, so the reference-profile argument that pins the
    # Rust suite to Windows does not reach it — and the cheapest runner is the right one when the
    # platform genuinely does not enter the result.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: renderer/bundle-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: renderer/bundle-viewer/package-lock.json

      - name: Install (locked)
        run: npm ci

      # `verify` is the package's own script — typecheck, then build, then test — so what CI runs
      # and what a developer runs cannot drift into two different definitions of "verified".
      - name: Type-check, build, and test
        run: npm run verify
