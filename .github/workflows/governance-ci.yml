name: Governance CI — plan, queue, site

# AUTONOMY.md §6, "the ADR-index pattern": PLAN.yaml's recorded statuses must agree with what the
# repository can verify, or this fails. Pages and CUSTODIAN-QUEUE.md are only ever as true as this
# check.
#
# ## Why ubuntu-latest, unlike product-ci-shell.yml's windows-latest
#
# `product-ci-viewer.yml`'s own reasoning applies here without modification: this is pure Node
# (standard library only — no dependency is added anywhere under scripts/plan or scripts/hooks),
# with no native or platform-specific surface of its own. It shells out to `git` and `gh`, both
# preinstalled on GitHub-hosted runners of every OS, so the cheapest runner is the right one.
#
# ## Why no `npm ci` step
#
# There is no `package.json` here and none is added — the whole point of this piece is that no
# dependency is added (AUTONOMY.md's own directive). `node --test` and every script under
# scripts/plan and scripts/hooks run directly against Node's standard library.
#
# ## What a green run here means, stated narrowly (the other product workflows' own discipline)
#
# It means: every test under scripts/plan and scripts/hooks passes, every rooted (in-tree) path:line
# reference resolves against the tree (verify:cites), every quotation marked verbatim occurs in its
# named file when a path:line cite introduces it, otherwise in the tracked tree's non-quotation text,
# after presentation normalization -- or is a recorded, classified baseline entry (pending the human's
# sight at its PR), advisory rather than gated (verify:quotes, the human's round-10 ruling: "a quote
# marked verbatim that does not match its source byte-for-byte is a gate failure by name"; round 11's
# ratchet: every baseline entry carries a disposition and a ruling, or the check fails by name). Every
# `path:a-b @ <rev> sha256:<hex>` reference is recomputed against `git show <rev>:<path>` and fails by
# name on a mismatch or an unresolvable rev, path or range (round 12's "quote by reference" mechanism).
# For a passage with no `path:line` beside it this proves only that the words occur somewhere in the
# tree's non-quotation text -- a floor, not proof the citing document's own claimed source is that
# occurrence; a gate still resolves each passage against its named source. It does not recognize `…`
# as an elision marker either -- round 11 item 3's rider (an elision may not drop a negation, a
# condition or a qualifier) is a human-read rule, not yet a mechanical one, so an elided quote is
# either baselined by hand or a false FAIL, never verified by construction (round-12 fix round, the
# architect's N2). Every test named in a
# preregistration/ADR exists (verify:test-claims),
# PLAN.yaml's recorded statuses agree with what the repository can verify
# (merged PRs, ADR Status lines, tags, releases, commits on main, tracked paths), and regenerating
# CUSTODIAN-QUEUE.md/.json and site/ produces no diff.
# It does **not** mean any hook has been exercised inside a real Claude Code session — that is the
# dry runs recorded in state/CUT-STATE.md (AUTONOMY.md §3, §7), a human-run instrument, not a
# per-push check.
#
# ## Read-only, GITHUB_TOKEN only
#
# verify.mjs's own GitHub calls (`gh api .../pulls/N`, `gh release view`) are read-only; no
# secrets beyond the default GITHUB_TOKEN are used, and the permissions block below grants nothing
# beyond `contents: read` (AI_DEVELOPMENT.md's public-repo rule: least privilege, re-issued by the
# human).

# Reviewer should-fix 2 (VERIFY-QUOTES-PREREGISTRATION.md Amendment 7): these `paths:` filters cover the
# set of files verify:quotes CITES FROM (preregistrations, ADRs, this workflow) -- a quote breaks when
# its SOURCE changes, and a source can be DECISIONS-PENDING.md, AUTONOMY.md, or any other tracked file
# in the whole-tree haystack (see verify-quotes.mjs's own header). This filter set is deliberately not
# widened to the whole tree (it would make every push run this job); disclosed, not fixed, here --
# editing a ruling elsewhere and never touching a citing file leaves this job unrun until the next push
# that does touch one of the paths below.
on:
  push:
    paths:
      - "PLAN.yaml"
      - "scripts/plan/**"
      - "scripts/hooks/**"
      - "site/**"
      - "CUSTODIAN-QUEUE.md"
      - "CUSTODIAN-QUEUE.json"
      - ".claude/settings.json"
      - ".github/workflows/governance-ci.yml"
      - "**/*PREREGISTRATION*.md"
      - "docs/adr/**"
  pull_request:
    paths:
      - "PLAN.yaml"
      - "scripts/plan/**"
      - "scripts/hooks/**"
      - "site/**"
      - "CUSTODIAN-QUEUE.md"
      - "CUSTODIAN-QUEUE.json"
      - ".claude/settings.json"
      - ".github/workflows/governance-ci.yml"
      - "**/*PREREGISTRATION*.md"
      - "docs/adr/**"
  workflow_dispatch:

concurrency:
  group: governance-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    name: test · verify:plan · queue/site drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 -- verify.mjs's evidence checks need real history: `git tag --list` (evidence
      # {tag: ...}) and `git merge-base --is-ancestor <commit> origin/main` (evidence {commit: ...})
      # both silently fail against actions/checkout@v4's default shallow (depth-1, tagless) clone.
      # CI run 34783672136 failed exactly this way: `git tag "v0.1.0" does not exist` and
      # `a047a23 is not an ancestor of origin/main` -- the tag and the commit were both real, the
      # clone just could not see them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: node --test (scripts/plan, scripts/hooks)
        run: node --test "scripts/plan/*.test.mjs" "scripts/hooks/*.test.mjs"

      # Pre-gate self-checks (AUTONOMY.md Appendix A3): mechanical integrity so the semantic gates
      # below fail only on semantics. All three are pure Node over `git ls-files`, no network, no `gh`.
      - name: verify:cites (path:line references resolve against the tree)
        run: node scripts/plan/verify-cites.mjs

      - name: verify:quotes (a passage marked verbatim occurs in its named file when a path:line cite introduces it, otherwise in the tracked tree's non-quotation text, after presentation normalization, and every path:a-b @ rev sha256:hex reference recomputes; recorded baseline entries advisory)
        run: node scripts/plan/verify-quotes.mjs

      - name: verify:test-claims (a test named in a preregistration/ADR actually exists)
        run: node scripts/plan/verify-test-claims.mjs

      - name: verify:plan (PLAN.yaml agrees with the repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/plan/verify.mjs

      - name: buildHealth smoke (temp dir; shows the scoped token's reach in the log)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/plan/buildHealth.mjs --out-dir "$RUNNER_TEMP/site" && cat "$RUNNER_TEMP/site/data/build-health.json"

      - name: CUSTODIAN-QUEUE.md/.json drift check
        run: node scripts/plan/queue.mjs --check

      - name: site/ drift check
        run: node scripts/plan/site.mjs --check
