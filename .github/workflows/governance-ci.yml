name: Governance CI — plan, queue, site

# AUTONOMY.md §6, "the ADR-index pattern": PLAN.yaml's recorded statuses must agree with what the
# repository can verify, or this fails. Pages and CUSTODIAN-QUEUE.md are only ever as true as this
# check.
#
# ## Why ubuntu-latest, unlike product-ci-shell.yml's windows-latest
#
# `product-ci-viewer.yml`'s own reasoning applies here without modification: this is pure Node
# (standard library only — no dependency is added anywhere under scripts/plan or scripts/hooks),
# with no native or platform-specific surface of its own. It shells out to `git` and `gh`, both
# preinstalled on GitHub-hosted runners of every OS, so the cheapest runner is the right one.
#
# ## Why no `npm ci` step
#
# There is no `package.json` here and none is added — the whole point of this piece is that no
# dependency is added (AUTONOMY.md's own directive). `node --test` and every script under
# scripts/plan and scripts/hooks run directly against Node's standard library.
#
# ## What a green run here means, stated narrowly (the other product workflows' own discipline)
#
# It means: every test under scripts/plan and scripts/hooks passes, PLAN.yaml's recorded statuses
# agree with what the repository can verify (merged PRs, ADR Status lines, tags, releases, commits
# on main, tracked paths), and regenerating CUSTODIAN-QUEUE.md/.json and site/ produces no diff.
# It does **not** mean any hook has been exercised inside a real Claude Code session — that is the
# dry runs recorded in state/CUT-STATE.md (AUTONOMY.md §3, §7), a human-run instrument, not a
# per-push check.
#
# ## Read-only, GITHUB_TOKEN only
#
# verify.mjs's own GitHub calls (`gh api .../pulls/N`, `gh release view`) are read-only; no
# secrets beyond the default GITHUB_TOKEN are used, and the permissions block below grants nothing
# beyond `contents: read` (AI_DEVELOPMENT.md's public-repo rule: least privilege, re-issued by the
# human).

on:
  push:
    paths:
      - "PLAN.yaml"
      - "scripts/plan/**"
      - "scripts/hooks/**"
      - "site/**"
      - "CUSTODIAN-QUEUE.md"
      - "CUSTODIAN-QUEUE.json"
      - ".claude/settings.json"
      - ".github/workflows/governance-ci.yml"
  pull_request:
    paths:
      - "PLAN.yaml"
      - "scripts/plan/**"
      - "scripts/hooks/**"
      - "site/**"
      - "CUSTODIAN-QUEUE.md"
      - "CUSTODIAN-QUEUE.json"
      - ".claude/settings.json"
      - ".github/workflows/governance-ci.yml"
  workflow_dispatch:

concurrency:
  group: governance-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    name: test · verify:plan · queue/site drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: node --test (scripts/plan, scripts/hooks)
        run: node --test scripts/plan scripts/hooks

      - name: verify:plan (PLAN.yaml agrees with the repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/plan/verify.mjs

      - name: CUSTODIAN-QUEUE.md/.json drift check
        run: node scripts/plan/queue.mjs --check

      - name: site/ drift check
        run: node scripts/plan/site.mjs --check
