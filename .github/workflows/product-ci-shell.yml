name: Product CI — shell

# frontends/shell's own suite: typecheck, build, vitest, and the Tauri backend's cargo tests.
#
# ## Why a third workflow rather than a job on either existing one
#
# GitHub applies `on.push.paths` per **workflow**, not per job. Folding this into
# `product-ci-viewer.yml` would spend that workflow's install on every kernel/engine change that
# happens to touch `protocol/skp/tests/data/**`; folding it into `product-ci-rust.yml` would spend a
# vendored-DuckDB Rust build on every pure-frontend edit. The two packages also have different
# working directories, lockfiles, and cache keys, and this one — uniquely among the three — needs
# both a Node toolchain and a Rust one in the same job.
#
# ## Why `windows-latest`, unlike the viewer's `ubuntu-latest`
#
# The viewer workflow's own reasoning ("pure TypeScript with no native surface of its own") does not
# reach here: this job builds `frontends/shell/src-tauri`, a Tauri crate whose reference profile is
# Windows/WebView2 (CLAUDE.md), and `tauri` on Linux needs webkit2gtk system packages this repository
# has never validated. Splitting the Node half onto `ubuntu-latest` would double checkout and install
# to save nothing, since the Rust half still needs `windows-latest`.
#
# ## What a green run here means, stated narrowly (product-ci-rust.yml's own discipline, repeated)
#
# It means: `frontends/shell` type-checks, builds, and its vitest suite passes; and
# `frontends/shell/src-tauri` compiles and its own `cargo test` suite passes. It does **not** mean:
#
#   - **`tauri build` was run BY THE `shell` JOB above.** That job's own steps stop at `cargo check
#     --release`; bundling/installer/signing are not exercised by IT. **Dated correction, 2026-09-08,
#     release-cut fix batch: this sentence used to say "tauri build was run [nowhere in this workflow]", which is
#     now false — the SEPARATE `tauri-build` job below DOES run it**, build-only, no signing, subject
#     to its own not-a-gate note (this file's own "Standing not-a-gate note" section) until IT has
#     gone green end to end and is recorded there. A green `shell` job alone still says nothing about
#     the installer; a green `tauri-build` job says the installer builds, once one has actually run.
#   - **Any UI, admission, canvas, or streaming behaviour was exercised interactively.** No browser,
#     no WebView2, no real GeoParquet fixture opened end to end. That is the tester's own pass.
#   - **Any performance claim, or anything about macOS/Linux** — same standing caveat as the other
#     two product workflows.
#
# ## The shared-fixture path, watched here too
#
# `protocol/skp/tests/data/**` is the same reasoning `product-ci-viewer.yml` already states for
# `renderer/tests/data/manifest-key-sets.json`: a reader (this crate's future TypeScript SKP client)
# and a writer (`protocol/skp`'s own Rust tests) with separate tables can each stay green while
# disagreeing about the wire shape. Both this workflow and `product-ci-rust.yml` watch the directory.
#
# ## The upstream crate paths, watched here too (S13, reviewer, this cut)
#
# `frontends/shell/src-tauri/Cargo.toml` depends on `kernel`, `engine`, `protocol/data-plane` and
# `protocol/skp` by relative path, outside `frontends/shell/**` — a change to any of their `src/`
# trees can break this crate's own `cargo test` step below without touching a single path the
# filters otherwise watch. `protocol/skp/tests/data/**` is already covered above; its `src/**` is
# listed explicitly rather than assumed to be, since `protocol/skp/**` alone would also catch the
# fixture directory a second time.
#
# ## The style-ts path, watched here too (reviewer gate, style-panel cut P7 fixes, B1 — blocking)
#
# `frontends/shell/src/style/document.ts` imports `renderer/style-ts/src/style.ts` by relative path
# (ADR-022's extraction: the shared TS style semantics live there, outside `frontends/shell/**`
# entirely). Before this fix, a change under `renderer/style-ts/**` alone matched none of this
# workflow's path filters — the shell's own second consumption of that shared code went unchecked by
# CI, the same class of gap `product-ci-viewer.yml` closes for the bundle viewer's own import of it.
#
# ## The bundle-viewer notice path, watched here too (RELEASE-0.1 Amendment 3, items 2/3)
#
# `frontends/shell`'s own `npm run build` (and therefore `npm run verify`, and `tauri build`) now
# has a `prebuild`/`pretypecheck` step (`scripts/generateNotice.mjs`) that imports
# `renderer/bundle-viewer/notice.mjs`'s `notice()` directly — the packaged app's `NOTICE.txt` is
# generated from it. Byte-identity with the viewer's own `dist/NOTICE.txt` is asserted by a real
# test (`src/notices/noticeByteIdentity.test.ts`, `npm test`'s own `pretest` builds both first) —
# not merely claimed here (a release-cut fix batch found this exact sentence FALSE for a caller
# running from this package's own cwd, before `notice.mjs`'s `baseDir` fix). A change to that ONE
# file (its text, not its dependents) is watched explicitly, the same gap `product-ci-viewer.yml`'s
# own lines 50-56 already name for `renderer/style-ts/**` — `renderer/bundle-viewer/**` at large is
# still not watched by this workflow (only this one file, whose content this workflow's own build
# now depends on).
#
# ## Standing not-a-gate note
#
# **Until a run of this workflow has gone green end to end, it is configuration that has never been
# exercised, and nothing in this repository may cite it as a gate.** When it does, record the run id,
# commit, trigger and duration here, as the other two product workflows do. The same applies,
# separately, to the `tauri-build` job below (RELEASE-0.1 Amendment 3, item 4): it is build-only, no
# signing, no release publishing, and nothing may cite a green run of it as a gate either until one
# has happened end to end, recorded here with its own run id/commit/trigger/duration.
#
# ## `tauri-build` job — first-green record slot (house form, `product-ci-rust.yml:76`/`:93`'s own
# pattern; release-cut fix batch, SHOULD-FIX 8) — EMPTY, filled only once a run has actually gone
# green end to end:
#
#   **First green run:** run id `34190120055`, job id `101946288669` ("tauri build (NSIS,
#   build-only, no signing)"), head commit `34a1896`, event `pull_request`, duration 27m19s
#   (05:18:24Z–05:45:43Z, 2026-09-08). `34a1896` was `cut/release-packaged-build`'s pre-rebase
#   head at the time this run went green — the branch has since been rebased onto `main`, so this
#   record is the record of the JOB going green, not of the current tree.
#
#   | trigger | first green | duration |
#   |---|---|---|
#   | `push` | — | — |
#   | `workflow_dispatch` | — | — |
#   | `pull_request` | `34190120055` (`34a1896`) | 27m19s |

on:
  push:
    paths:
      - "frontends/shell/**"
      - "kernel/**"
      - "engine/**"
      - "protocol/data-plane/**"
      - "protocol/skp/src/**"
      - "protocol/skp/tests/data/**"
      - "renderer/style-ts/**"
      - "renderer/bundle-viewer/notice.mjs"
      # RELEASE-0.1 item 3e (release-cut fix batch, MUST-FIX 4): the first cross-module
      # compile-time file dependency in this repository — `kernel/src/publish/ceilings.rs`
      # `include_str!`s this exact file, so it changes compiled kernel behaviour this crate's own
      # `cargo test` step below exercises, not just the two TypeScript workflows.
      - "renderer/bundle-viewer/ceilings.json"
      - ".github/workflows/product-ci-shell.yml"
  pull_request:
    paths:
      - "frontends/shell/**"
      - "kernel/**"
      - "engine/**"
      - "protocol/data-plane/**"
      - "protocol/skp/src/**"
      - "protocol/skp/tests/data/**"
      - "renderer/style-ts/**"
      - "renderer/bundle-viewer/notice.mjs"
      # RELEASE-0.1 item 3e (release-cut fix batch, MUST-FIX 4): the first cross-module
      # compile-time file dependency in this repository — `kernel/src/publish/ceilings.rs`
      # `include_str!`s this exact file, so it changes compiled kernel behaviour this crate's own
      # `cargo test` step below exercises, not just the two TypeScript workflows.
      - "renderer/bundle-viewer/ceilings.json"
      - ".github/workflows/product-ci-shell.yml"
  workflow_dispatch:

concurrency:
  group: product-ci-shell-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell:
    name: typecheck · build · vitest · cargo test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontends/shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-latest-shell
          workspaces: "frontends/shell/src-tauri"

      # RELEASE-0.1 items 2/3: the shell's own `npm run build` now has a `prebuild` step
      # (`scripts/generateNotice.mjs`) that reads `renderer/bundle-viewer/dist-metafile.json` —
      # written by THIS package's own build, not the shell's — so it must run first here, the same
      # ordering `frontends/shell/src-tauri`'s `bundle.resources` (the viewer's `dist/` shipped as a
      # packaged resource) and `tauri build` below both need too.
      - name: Install and build the bundle viewer (a precondition of the shell's own build)
        working-directory: renderer/bundle-viewer
        run: |
          npm ci
          npm run build

      - name: Install (locked)
        working-directory: frontends/shell
        run: npm ci

      # `verify` is the package's own script (typecheck -> check:dev-origin -> check:origin-event ->
      # build -> check:dist-clean -> check:dist-notice -> test -> test:residency-trace ->
      # test:citation-integrity, `package.json`'s own definition — ADR-020 Amendment 1 added both
      # `check:dev-origin` and `check:origin-event`), so CI and a developer cannot drift into two
      # different definitions of "verified" — the viewer workflow's own convention. Runs before cargo
      # below because the Tauri crate's own build reads the frontend's `dist/` output as
      # `frontendDist`, even though this step does not invoke `tauri build` itself.
      - name: Type-check, build, and test the frontend
        working-directory: frontends/shell
        run: npm run verify

      # Not `cargo build --workspace`: this crate is deliberately excluded from the root workspace
      # (root Cargo.toml explains why) and carries its own lockfile.
      - name: Build and test the Tauri backend
        run: cargo test --manifest-path frontends/shell/src-tauri/Cargo.toml --locked

      # Reviewer nit viii (entry-40 pass): the debug-profile `cargo test` step above compiles this
      # crate with `debug_assertions` true, so it alone can never catch a `cfg(any(debug_assertions,
      # feature = "measure-build"))`-gated regression that only breaks a plain RELEASE build (neither
      # condition true) -- e.g. an unused-variable warning `pool_poll.rs`'s own `cfg_attr` (via
      # `commands.rs`'s `open_dataset`/`close_dataset`) exists specifically to suppress there. These
      # two checks were run by hand for this piece's own review; wiring them into CI keeps that gate
      # honest going forward rather than relying on a human to remember to run them locally.
      - name: Check the plain release profile compiles (dev-gated instruments must compile OUT)
        run: cargo check --manifest-path frontends/shell/src-tauri/Cargo.toml --release --locked

      - name: Check the measure-build release profile compiles
        run: cargo check --manifest-path frontends/shell/src-tauri/Cargo.toml --release --locked --features measure-build

  # RELEASE-0.1 Amendment 3, item 4: `tauri build` on the reference platform, build-only. No
  # signing, no release publishing — the artifact is uploaded so it can be sighted, never
  # published from CI. This workflow's own standing not-a-gate note (top of file) applies to this
  # job exactly as it does to `shell` above: nothing may cite a green run here as a gate until one
  # has actually gone green end to end, recorded with its run id/commit/trigger/duration.
  tauri-build:
    name: tauri build (NSIS, build-only, no signing)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontends/shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-latest-shell-tauri-build
          workspaces: "frontends/shell/src-tauri"

      # Same precondition as the `shell` job above: the viewer must be built before the shell's own
      # `prebuild` step (notice generation) and before `bundle.resources` has anything to map.
      - name: Install and build the bundle viewer
        working-directory: renderer/bundle-viewer
        run: |
          npm ci
          npm run build

      - name: Install shell dependencies (locked)
        working-directory: frontends/shell
        run: npm ci

      - name: tauri build (NSIS only, per-user install — tauri.conf.json's own targets/installMode)
        working-directory: frontends/shell
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: spatial-ide-nsis-installer
          path: frontends/shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
