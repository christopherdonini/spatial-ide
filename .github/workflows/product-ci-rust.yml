name: Product CI — Rust workspace

# The **product** modules' regression suite: kernel/, engine/, renderer/, protocol/data-plane.
#
# ## Why this file exists
#
# The two adr-003-spike-ci-* workflows are path-filtered to `spikes/adr-003-crs-rendering/**` and
# validate the concluded spike. Nothing watched the product modules, so every commit that built the
# engine, the publish path and the bundle format landed on `main` **without ever having been built
# or tested by CI** — including b17deca. This closes that, and nothing more.
#
# ## What a green run here means, stated narrowly
#
# It means: the workspace compiles on the reference profile and its ordinary test suite passes.
#
# It does **not** mean any of the following, and must never be cited for them:
#
#   - **No performance claim.** The `docs/08` budget harnesses (`kernel/tests/slice_budgets.rs`,
#     `kernel/tests/indexed_budgets.rs`) are `#[ignore]`d and are NOT run here. They take minutes,
#     refuse to run on a debug build, and write evidence artifacts; a shared CI runner is a machine
#     that drifts between and within sessions, which the bake-off README §21/§22 records as
#     asymmetric and uncancellable by ratio. A number taken here would not be a smaller number, it
#     would not be a measurement. Nothing in this workflow may fill a results table.
#   - **Nothing about macOS or Linux.** It runs on the Windows reference profile only — see the
#     runner note below.
#   - **Nothing about the ADR-003 hardware-validation gate** (`docs/07`), which is about native
#     WebView integration, frame pacing, GPU behaviour and picking latency on real hardware. No
#     amount of green here advances it.
#
# ## Runner choice
#
# **`windows-latest`.** The reference profile in `CLAUDE.md` is Windows 10 / MSVC / WebView2, every
# claim this repository makes is scoped to it, and it is the platform the workspace suite is actually
# known to pass on. Running the only job somewhere else would mean CI covering a platform the
# constitution makes no claims for while leaving the one it does claim untested, and would do it on
# a platform nothing has yet verified the suite on.
#
# Adding `ubuntu-latest` to the matrix below is a line, and is worth doing: it would catch
# path-separator and case-sensitivity assumptions, which `publish/mod.rs`'s `replace('\\', "/")` and
# `viewer_assets.rs`'s backslash rejection genuinely have surface for. It is not added here because
# **nothing has yet established that the suite passes on Linux** — see the note below on why that
# could not be settled — and a matrix entry that has never run is a red build waiting to happen
# rather than coverage.
#
# > **Unverified by CI as of 2026-08-06, and the reason is environmental — not this file.** No run
# > of either product workflow on that date was ever assigned a GitHub-hosted runner. Three runs,
# > both labels, each **cancelled at exactly 15 minutes queued having executed no step**:
# >
# > | run | label | queued | cancelled |
# > |---|---|---|---|
# > | 31125488081 (rust) | `windows-latest` | 18:14:32Z | 18:29:32Z |
# > | 31127603650 (rust) | `ubuntu-latest` | 20:26:13Z | 20:41:15Z |
# > | 31127603658 (viewer) | `ubuntu-latest` | 20:26:13Z | 20:41:17Z |
# >
# > **The constraint is therefore not platform-specific and not a transient stall** — an identical
# > 15-minute cancellation on two different labels is a rule firing, not capacity. An
# > `ubuntu-latest` dispatch of the ADR-003 spike workflow on this same repository *did* start within
# > about two minutes earlier the same day, so it is also not a permanent property of the repository.
# > **Why is not established here**: an Actions spending limit, plan entitlement and a policy on
# > queue time all fit, and this file does not claim to know which. Checking
# > `Settings → Billing → Actions` is the first thing to try.
# >
# > What *is* established is local, on the reference profile: **261 passed, 0 failed, 2 ignored**
# > (the two `docs/08` harnesses), plus the viewer's 45. **Until a run here goes green this workflow
# > is configuration that has never been exercised end to end, and it must not be treated as a
# > gate.** Nothing in this repository may cite it as one until then.
# >
# > **2026-08-07, on the `pre-public-checklist` branch: 268 passed, 0 failed, 2 ignored, plus the
# > viewer's 52.** The counts moved because ADR-017 Corrigendum 3 added tests on both sides; the two
# > `docs/08` harnesses are still the ignored pair and are still not run here. **The runner
# > constraint above is unchanged and no run of this workflow has gone green**, so this line records
# > a local result and advances nothing about CI.
#
# ## Resolved — 2026-08-07. The caveat above is lifted; the evidence is kept.
#
# **First green run: `31156155408`, `windows-latest`, push of `de6ad08` to `main`, started
# 2026-08-07T07:03:04Z, 41 minutes, all nine steps executed and succeeded** — checkout, toolchain,
# cache, `Build the workspace and every test target`, `Run the ordinary suite`. The bundle-viewer
# workflow's first green run is `31156155406` on the same commit, 15 seconds, all steps executed.
# A runner was assigned within seconds in both cases.
#
# So the runner constraint recorded above **was** environmental and **is** gone; which of the three
# candidate causes it was is still not established here, and the note is retained rather than
# deleted because a lifted caveat whose evidence has been erased cannot be checked. What changes is
# only the status: **this workflow has now been exercised end to end, and it may be cited as a
# gate.** Everything under "What a green run here means" — no performance claim, nothing about
# macOS or Linux, nothing about the ADR-003 hardware-validation gate — is unchanged and still bounds
# what green means.
#
# **All three triggers have since been exercised green**, which is worth recording separately because
# each is a different code path through this file:
#
#   | trigger | first green | duration |
#   |---|---|---|
#   | `push` | `31156155408` (`de6ad08`) | 41 min — cold, vendored DuckDB built from source |
#   | `workflow_dispatch` | `31163428520` | **5m08s** |
#   | `pull_request` | `31199038972` (PR #3) | 6m54s |
#
# **The 41 min → ~5–7 min drop is `Swatinem/rust-cache` doing what it was added for**, not the
# workspace getting smaller. It is the measured answer to the "cost being managed" section below, and
# it is the number to check against before adding a second matrix entry — a new platform pays the
# 41-minute build once and the cached figure thereafter.
#
# ## The cost being managed
#
# `engine/` builds DuckDB from vendored C++ (`bundled`), and `Cargo.toml` compiles `libduckdb-sys`
# at `opt-level = 2` even in the dev profile — deliberately, because it buys the time back on every
# query in every test. That makes the first build on any fresh runner the dominant cost of this
# workflow, and it is paid **per platform in the matrix**, which is the reason a second entry is a
# decision rather than a freebie.
#
# The cost is managed by caching rather than by dropping coverage: `Swatinem/rust-cache` keyed on
# the lockfile, so the vendored C++ tree is rebuilt only when a dependency actually moves.

on:
  push:
    paths:
      - "kernel/**"
      - "engine/**"
      - "renderer/**"
      # …but not the viewer's TypeScript, which no Rust target reads. Without this exclusion a pure
      # front-end edit spends a vendored DuckDB build, which is the exact waste the two-workflow
      # split exists to avoid. The Rust side reads `renderer/tests/data/**` — the shared style and
      # key-set artifacts — and that stays covered by `renderer/**` above.
      - "!renderer/bundle-viewer/**"
      - "protocol/data-plane/**"
      - "protocol/skp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/product-ci-rust.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "engine/**"
      - "renderer/**"
      # …but not the viewer's TypeScript, which no Rust target reads. Without this exclusion a pure
      # front-end edit spends a vendored DuckDB build, which is the exact waste the two-workflow
      # split exists to avoid. The Rust side reads `renderer/tests/data/**` — the shared style and
      # key-set artifacts — and that stays covered by `renderer/**` above.
      - "!renderer/bundle-viewer/**"
      - "protocol/data-plane/**"
      - "protocol/skp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/product-ci-rust.yml"
  workflow_dispatch:

# A superseded push is cancelled rather than left to finish a vendored C++ build nobody is waiting
# for. `main` is exempt: its runs are the ones a later bisect reads.
concurrency:
  group: product-ci-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workspace:
    name: cargo test --workspace
    strategy:
      fail-fast: false
      matrix:
        # One entry today — the reference profile. It stays a matrix rather than a bare `runs-on`
        # precisely because adding `ubuntu-latest` should be a line here and not a restructure; see
        # the runner note above for what has to be true first.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    # The vendored DuckDB build dominates a cold run. Bounded so a hung job is killed rather than
    # burning the default six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile: the vendored C++ tree is rebuilt only when a dependency moves, which
      # is the whole cost this workflow has to manage.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-workspace

      # Split from the test step so a compile failure is reported as one, rather than as a test
      # run that never started. `--tests` builds the integration targets too, including the
      # `#[ignore]`d harnesses — they must keep *compiling* even though they never run here, or
      # they would rot silently between measurement passes.
      - name: Build the workspace and every test target
        run: cargo build --workspace --tests --locked

      # **No `--ignored`, deliberately.** `cargo test` skips `#[ignore]`d tests by default, which is
      # exactly what excludes the two `docs/08` measurement harnesses. The count appears in this
      # step's own output as "N ignored", so a reader can see they were skipped rather than absent.
      #
      # `protocol/transport-bakeoff` is not a workspace member and is therefore not built here. That
      # is deliberate and is stated in `Cargo.toml`: it is pinned decision evidence for ADR-012, and
      # folding it into the workspace would let a dependency bump silently change a measured
      # artifact.
      - name: Run the ordinary suite
        run: cargo test --workspace --locked
