name: Product CI — Rust workspace

# The **product** modules' regression suite: kernel/, engine/, renderer/, protocol/data-plane.
#
# ## Why this file exists
#
# The two adr-003-spike-ci-* workflows are path-filtered to `spikes/adr-003-crs-rendering/**` and
# validate the concluded spike. Nothing watched the product modules, so every commit that built the
# engine, the publish path and the bundle format landed on `main` **without ever having been built
# or tested by CI** — including b17deca. This closes that, and nothing more.
#
# ## What a green run here means, stated narrowly
#
# It means: the workspace compiles on the reference profile and its ordinary test suite passes.
#
# It does **not** mean any of the following, and must never be cited for them:
#
#   - **No performance claim.** The `docs/08` budget harnesses (`kernel/tests/slice_budgets.rs`,
#     `kernel/tests/indexed_budgets.rs`) are `#[ignore]`d and are NOT run here. They take minutes,
#     refuse to run on a debug build, and write evidence artifacts; a shared CI runner is a machine
#     that drifts between and within sessions, which the bake-off README §21/§22 records as
#     asymmetric and uncancellable by ratio. A number taken here would not be a smaller number, it
#     would not be a measurement. Nothing in this workflow may fill a results table.
#   - **Nothing about macOS, and nothing about Windows.** It runs on Linux only, which is *not* the
#     reference profile — see the runner note below for why, and for what that leaves uncovered.
#   - **Nothing about the ADR-003 hardware-validation gate** (`docs/07`), which is about native
#     WebView integration, frame pacing, GPU behaviour and picking latency on real hardware. No
#     amount of green here advances it.
#
# ## Runner choice — what was wanted, what was observed, and what this therefore does
#
# **`windows-latest` was the first choice and is not what runs here.** The reference profile in
# `CLAUDE.md` is Windows 10 / MSVC / WebView2 and every claim this repository makes is scoped to it,
# so the reference platform is the one a regression suite most wants to cover.
#
# **What was observed, stated as an observation rather than as a diagnosis.** On 2026-08-06 a
# `windows-latest` job on this repository (run 31125488081) sat **queued for 15 minutes without ever
# being assigned a runner** and was then cancelled, having executed no step. A `ubuntu-latest` job on
# the same repository minutes earlier reached `in_progress` within about two minutes. **Why** the
# Windows job was never scheduled is *not* established here — plan entitlement, a spending limit and
# a transient capacity incident all fit one data point, and this file does not claim to know which.
#
# **The consequence, which is a real gap and is not being papered over.** The suite runs on
# `ubuntu-latest`, so **CI does not cover the reference profile.** Windows-shaped behaviour is
# therefore exercised only by a developer running the suite locally: `publish/mod.rs`'s
# `replace('\\', "/")` on a staged path, `viewer_assets.rs`'s backslash rejection, and every
# `std::path` separator assumption underneath them. A green run here is evidence about the *logic*,
# on a platform this constitution does not make claims for. Restoring Windows is a one-line change to
# the matrix below and should be attempted again — the observation above is a fact about one
# afternoon, not a permanent property.
#
# ## The cost being managed
#
# `engine/` builds DuckDB from vendored C++ (`bundled`), and `Cargo.toml` compiles `libduckdb-sys`
# at `opt-level = 2` even in the dev profile — deliberately, because it buys the time back on every
# query in every test. That makes the first build on any fresh runner the dominant cost of this
# workflow, and it is paid **per platform in the matrix**, which is the reason a second entry is a
# decision rather than a freebie.
#
# The cost is managed by caching rather than by dropping coverage: `Swatinem/rust-cache` keyed on
# the lockfile, so the vendored C++ tree is rebuilt only when a dependency actually moves.

on:
  push:
    paths:
      - "kernel/**"
      - "engine/**"
      - "renderer/**"
      # …but not the viewer's TypeScript, which no Rust target reads. Without this exclusion a pure
      # front-end edit spends a vendored DuckDB build, which is the exact waste the two-workflow
      # split exists to avoid. The Rust side reads `renderer/tests/data/**` — the shared style and
      # key-set artifacts — and that stays covered by `renderer/**` above.
      - "!renderer/bundle-viewer/**"
      - "protocol/data-plane/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/product-ci-rust.yml"
  pull_request:
    paths:
      - "kernel/**"
      - "engine/**"
      - "renderer/**"
      # …but not the viewer's TypeScript, which no Rust target reads. Without this exclusion a pure
      # front-end edit spends a vendored DuckDB build, which is the exact waste the two-workflow
      # split exists to avoid. The Rust side reads `renderer/tests/data/**` — the shared style and
      # key-set artifacts — and that stays covered by `renderer/**` above.
      - "!renderer/bundle-viewer/**"
      - "protocol/data-plane/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/product-ci-rust.yml"
  workflow_dispatch:

# A superseded push is cancelled rather than left to finish a vendored C++ build nobody is waiting
# for. `main` is exempt: its runs are the ones a later bisect reads.
concurrency:
  group: product-ci-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workspace:
    name: cargo test --workspace
    strategy:
      fail-fast: false
      matrix:
        # One entry today, and **not the one this project would choose** — see the runner note
        # above. It stays a matrix rather than a bare `runs-on` precisely because restoring
        # `windows-latest` should be a line here and not a restructure.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The vendored DuckDB build dominates a cold run. Bounded so a hung job is killed rather than
    # burning the default six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile: the vendored C++ tree is rebuilt only when a dependency moves, which
      # is the whole cost this workflow has to manage.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-workspace

      # Split from the test step so a compile failure is reported as one, rather than as a test
      # run that never started. `--tests` builds the integration targets too, including the
      # `#[ignore]`d harnesses — they must keep *compiling* even though they never run here, or
      # they would rot silently between measurement passes.
      - name: Build the workspace and every test target
        run: cargo build --workspace --tests --locked

      # **No `--ignored`, deliberately.** `cargo test` skips `#[ignore]`d tests by default, which is
      # exactly what excludes the two `docs/08` measurement harnesses. The count appears in this
      # step's own output as "N ignored", so a reader can see they were skipped rather than absent.
      #
      # `protocol/transport-bakeoff` is not a workspace member and is therefore not built here. That
      # is deliberate and is stated in `Cargo.toml`: it is pinned decision evidence for ADR-012, and
      # folding it into the workspace would let a dependency bump silently change a measured
      # artifact.
      - name: Run the ordinary suite
        run: cargo test --workspace --locked
