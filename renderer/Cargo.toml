[package]
name = "spatial-renderer"
version = "0.0.0"
edition = "2021"
publish = false
# ADR-009 item 1: forever-open core. Inherited from `[workspace.package]`.
license.workspace = true
description = "renderer module (docs/02, docs/06): style compilation. GPU rendering and labels are not in this cut."

[dependencies]
# `DataType` only, to validate a match column against a dataset schema. **Never `spatial-engine`** —
# `renderer -> engine` would invert docs/02's module map and the kernel's stated role as the only
# module that knows two others. Both crates depending on a third-party crate is not a coupling.
arrow = { workspace = true }
serde_json = "1"
sha2 = "0.10"
