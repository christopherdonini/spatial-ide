[package]
name = "spatial-kernel"
version = "0.0.0"
edition = "2021"
publish = false
# ADR-009 item 1: forever-open core. Inherited from `[workspace.package]`.
license.workspace = true
description = "Composition root for the first engine slice: engine → data-plane binding. Nothing else."

[lib]
name = "spatial_kernel"
path = "src/lib.rs"

[[bin]]
name = "slice-host"
path = "src/main.rs"

[dependencies]
spatial-engine = { path = "../engine" }
spatial-data-plane = { path = "../protocol/data-plane" }
spatial-skp = { path = "../protocol/skp" }
# Style compilation and the canonical-JSON grammar. The manifest and the style document share one
# number grammar on purpose — two would be two things to specify and two to re-implement.
spatial-renderer = { path = "../renderer" }
arrow = { workspace = true }
tokio = { workspace = true }
# `permission::audit::reader` (ADR-017's Exposure review, 2026-08-17, condition 2 --
# `publish-bundle --audit-show`) parses the audit log's own JSONL lines with this, in real
# (non-test) code -- previously a dev-dependency only, which sufficed while every `serde_json` use
# in this crate lived inside `#[cfg(test)]`.
serde_json = "1"

[dev-dependencies]
arrow = { workspace = true }
spatial-engine = { path = "../engine", features = ["fixture"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
